
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOKIROV SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d20;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#101a38;border-bottom:1px solid #24345e}
.logo{font-size:25px;font-weight:900;color:#56a5ff}
header p{color:#aab8d8;margin:7px 0 0;font-size:13px}
main{padding:16px;max-width:650px;margin:auto}
.balance{background:linear-gradient(120deg,#1749a9,#743ee0);padding:20px;border-radius:18px;margin-bottom:18px}
.balance small{color:#d8e5ff}
.balance h2{margin:8px 0;font-size:25px}
h3{margin:22px 0 12px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tabs button{flex:1;padding:13px;border:1px solid #34466e;background:#131e3b;color:white;border-radius:12px;font-weight:bold}
.tabs button.active{background:#2768df;border-color:#5298ff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:#121c38;border:1px solid #26365e;border-radius:14px;padding:13px}
.item h4{margin:4px 0 9px;font-size:15px}
.price{color:#65adff;font-weight:bold;margin:8px 0}
.item button,.checkout{width:100%;padding:11px;border:0;border-radius:10px;background:#2869e8;color:white;font-weight:bold}
.item button:active,.checkout:active{opacity:.7}
.cart{margin-top:22px;background:#111b36;padding:16px;border-radius:16px}
.cartline{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #293655;font-size:13px}
.total{display:flex;justify-content:space-between;font-weight:bold;margin:16px 0}
.empty{color:#aab8d8;font-size:14px}
footer{text-align:center;color:#8998bb;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="logo">ZOKIROV SHOP</div>
 <p>O‘yinlar uchun qulay va tezkor do‘kon</p>
</header>
<main>
 <section class="balance">
  <small>DO‘KON</small>
  <h2>Xush kelibsiz!</h2>
  <small>Kerakli o‘yinni tanlang</small>
 </section>

 <h3>O‘yinlar</h3>
 <div class="tabs">
  <button id="ffTab" class="active" onclick="showGame('ff')">🔥 Free Fire</button>
  <button id="pubgTab" onclick="showGame('pubg')">🎮 PUBG Mobile</button>
 </div>

 <h3 id="gameTitle">Free Fire mahsulotlari</h3>
 <div class="grid" id="products"></div>

 <section class="cart">
  <h3>🛒 Savatcha</h3>
  <div id="cartItems"><p class="empty">Savatcha hozircha bo‘sh.</p></div>
  <div class="total"><span>Jami:</span><span id="total">0 so‘m</span></div>
  <button class="checkout" onclick="order()">Buyurtmani ko‘rish</button>
 </section>
</main>
<footer>© 2026 ZOKIROV SHOP</footer>

<script>
const ffProducts = [
 ["110 Almaz",11000],
 ["341 Almaz",32000],
 ["572 Almaz",52000],
 ["1 166 Almaz",104000],
 ["2 398 Almaz",208000],
 ["6 160 Almaz",525000],
 ["Weekly Lite",5000],
 ["Weekly Membership",21000],
 ["Monthly Membership",78000],
 ["Evo Access 3d",6000],
 ["Evo Access 7d",10000],
 ["Evo Access 30d",28000],
 ["Newbie Bundle",3000],
 ["Level Up 6",4000],
 ["Level Up 10",7000],
 ["Level Up 15",7000],
 ["Level Up 20",7000],
 ["Level Up 25",7000],
 ["Level Up 30",10000]
];

let cart=[];
let game="ff";

function money(n){
 return n.toLocaleString("uz-UZ")+" so‘m";
}

function showGame(which){
 game=which;
 document.getElementById("ffTab").classList.toggle("active",which==="ff");
 document.getElementById("pubgTab").classList.toggle("active",which==="pubg");
 document.getElementById("gameTitle").textContent=
  which==="ff"?"Free Fire mahsulotlari":"PUBG Mobile";
 const area=document.getElementById("products");
 if(which==="ff"){
  area.innerHTML=ffProducts.map((p,i)=>`
   <div class="item">
    <h4>💎 ${p[0]}</h4>
    <div class="price">${money(p[1])}</div>
    <button onclick="add(${i})">Savatchaga qo‘shish</button>
   </div>`).join("");
 }else{
  area.innerHTML=`
   <div class="item" style="grid-column:1/-1">
    <h4>🎮 PUBG Mobile UC</h4>
    <p class="empty">PUBG narxlari tasdiqlangach mahsulotlar shu yerga qo‘shiladi.</p>
   </div>`;
 }
}

function add(i){
 cart.push({name:ffProducts[i][0],price:ffProducts[i][1]});
 renderCart();
}

function removeItem(i){
 cart.splice(i,1);
 renderCart();
}

function renderCart(){
 const area=document.getElementById("cartItems");
 if(!cart.length){
  area.innerHTML='<p class="empty">Savatcha hozircha bo‘sh.</p>';
 }else{
  area.innerHTML=cart.map((p,i)=>`
   <div class="cartline">
    <span>${p.name}</span>
    <span>${money(p.price)}
    <button onclick="removeItem(${i})" style="background:#a83248;color:white;border:0;border-radius:5px">×</button></span>
   </div>`).join("");
 }
 document.getElementById("total").textContent=
  money(cart.reduce((s,p)=>s+p.price,0));
}

function order(){
 if(!cart.length){
  alert("Avval mahsulot tanlang!");
  return;
 }
 alert("Demo savatcha. Buyurtma yuborish tizimi keyingi bosqichda ulanadi.");
}

showGame("ff");
</script>
</body>
</html>
